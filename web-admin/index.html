<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>婚礼请柬 · 数据后台</title>
<style>
*{box-sizing:border-box}
/* 🚨 .veil 写了 display:flex、.qrbox img 写了 display:block，都会压过 UA 的 [hidden]{display:none}，
   导致"正在准备二维码…"这层白幕永远盖在码上（码中心的小程序头像被挡住）。
   这条 !important 是根因修复，删了必复发。 */
[hidden]{display:none!important}
:root{--ivory:#faf6ef;--paper:#fffdf8;--gold:#b8935e;--gold-deep:#9a7743;
  --ink:#3a332a;--ink-soft:#6f6557;--line:#e8dfd0}
body{margin:0;background:var(--ivory);color:var(--ink);
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:34px 24px 64px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
header.top h1{margin:0;font-size:24px;letter-spacing:.08em;font-weight:600}
header.top h1 em{font-style:normal;color:var(--gold)}
header.top .sub{color:var(--ink-soft);font-size:12.5px;margin-top:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 14px rgba(140,115,80,.06)}
.card>h3{margin:0 0 4px;font-size:14.5px;font-weight:600;letter-spacing:.06em;
  display:flex;align-items:center;gap:8px}
.card>h3 .cnt{color:var(--gold)}
.btn{background:#fff;border:1px solid var(--line);color:var(--gold-deep);border-radius:8px;
  padding:5px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:#faf4ea;border-color:#ddc9a4}
.btn.primary{margin-left:auto;background:linear-gradient(135deg,#c2a173,#9a7743);
  color:#fffdf8;border:none;padding:9px 22px;font-size:14px;border-radius:22px}
.btn.ghost{margin-left:auto}

/* ---- 登录 ---- */
.login{text-align:center;padding:40px 22px 44px}
.lg-title{font-size:20px;font-weight:600;letter-spacing:.06em}
.lg-sub{color:var(--ink-soft);font-size:13px;margin-top:8px}
.qrbox{position:relative;width:260px;height:260px;margin:28px auto 18px;background:#fff;
  border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  overflow:hidden}
.qrbox img{width:240px;height:240px;display:block;object-fit:contain}
.qrbox .veil{position:absolute;inset:0;background:rgba(255,253,248,.94);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-soft);font-size:13px}
.lg-status{color:var(--ink-soft);font-size:13px;min-height:22px}
.lg-status.err{color:#a56a5c}
.need-login{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px}
.qr-holder{display:inline-flex;align-items:center;gap:8px}

/* ---- 看板 ---- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,#fffdfa,#faf4ea);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px}
.kpi .kv{font-size:30px;font-weight:600;color:var(--gold-deep);line-height:1.15;
  font-variant-numeric:tabular-nums}
.kpi .kl{color:var(--ink-soft);font-size:12.5px;margin-top:4px;letter-spacing:.05em}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:18px}
.grid2 .card{margin-bottom:0}
.hint{color:#a99a86;font-size:11.5px;margin-bottom:12px}
.hint b{color:var(--gold-deep)}
.bars{display:flex;gap:5px;height:158px;align-items:flex-end}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bi .v{font-size:10.5px;color:var(--ink-soft);height:15px}
.bi .t{flex:1;width:100%;display:flex;align-items:flex-end}
.bi .f{width:100%;background:linear-gradient(180deg,#d6bd94,#c2a173);border-radius:3px 3px 0 0;min-height:3px}
.bi .f.hot{background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.bi .l{font-size:9.5px;color:#ad9d89;height:13px;white-space:nowrap}
.drow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.dnm{width:76px;font-size:12px;color:var(--ink-soft);flex:none}
.dtr{flex:1;height:17px;background:#f4ede2;border-radius:5px;overflow:hidden}
.dfl{height:100%;background:linear-gradient(90deg,#d3b587,var(--gold));border-radius:5px}
.dvv{width:86px;flex:none;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.dvv .dpct{color:#b0a08c;font-size:11px;margin-left:5px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:12px;
  padding:7px 10px;border-bottom:1px solid var(--line);letter-spacing:.04em;white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid #f2ece1;vertical-align:top}
table.tb tr:last-child td{border-bottom:none}
table.tb .r{text-align:right;font-variant-numeric:tabular-nums}
table.tb .yes{color:#5c7a4c}
table.tb .no{color:#a56a5c}
table.tb .note{color:var(--ink-soft);max-width:240px}
table.tb .mt{color:#a99a86;font-size:12px;white-space:nowrap}
.rtotal{margin:2px 0 12px;color:var(--ink-soft);font-size:13px}
.rtotal b{color:var(--gold-deep);font-size:17px}
.msg{border-left:2px solid #ecdfc9;padding:2px 0 2px 14px;margin-bottom:14px}
.msg .mh{display:flex;align-items:baseline;gap:10px}
.msg .mh b{font-size:13.5px}
.msg .mt{color:#a99a86;font-size:11.5px}
.msg .mb{margin-top:3px;white-space:pre-wrap}
.empty{color:#b0a08c;font-size:12.5px;padding:10px 0}
footer{color:#a99a86;font-size:12px;text-align:center;margin-top:16px;line-height:1.9}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>数据后台 <em>·</em> 婚礼请柬</h1>
      <div class="sub" id="who">用微信扫码登录，随时查看访客与宾客留言</div>
    </div>
    <button class="btn ghost" id="btn-logout" hidden>退出登录</button>
  </header>

  <!-- ============ 登录 ============ -->
  <section class="card login" id="view-login">
    <div class="lg-title">微信扫码登录</div>
    <div class="lg-sub">用微信「扫一扫」扫描下方小程序码，在手机上点一下「确认登录」</div>
    <div class="qrbox" id="qrbox">
      <img id="qr" alt="登录小程序码" hidden>
      <div class="veil" id="veil">正在准备二维码…</div>
    </div>
    <div class="lg-status" id="lgstatus"></div>
    <div class="need-login">
      <button class="btn primary" id="btn-start" hidden>刷新二维码</button>
    </div>
  </section>

  <!-- ============ 看板 ============ -->
  <section id="view-dash" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card"><h3>近 14 天访问</h3>
        <div class="hint">柱子 = 每日访问次数 · 鼠标悬停看访客数</div><div id="chart"></div></div>
      <div class="card"><h3>浏览深度</h3>
        <div class="hint" id="depthhint">看到第几幕的人最多</div><div id="depth"></div></div>
    </div>
    <div class="card"><h3>传播链</h3>
      <div class="hint">谁把请柬分享出去、各自带来多少访客</div><div id="spread"></div></div>
    <div class="card"><h3>祝福留言 <span class="cnt" id="gcnt"></span>
      <button class="btn ghost" data-exp="greeting">导出 CSV</button></h3>
      <div id="greets"></div></div>
    <div class="card"><h3>回执名单 <span class="cnt" id="rcnt"></span>
      <button class="btn ghost" data-exp="rsvp">导出 CSV</button></h3>
      <div id="rids"></div></div>
  </section>

  <footer>
    数据来自云开发统计视图 · 登录状态 12 小时有效<br>
    <span id="lastload"></span><br>
    <span style="opacity:.55">页面版本 v3（2026-10-10 23:00 后部署）—— 如果你没看到这行字，说明浏览器在跑旧缓存，请 Ctrl+Shift+R 强刷</span>
  </footer>
</div>

<script>
(function () {
  'use strict'
  var ENV = 'xiaofeiyang-d3gx5ou5k7fe078eb'
  var TOKEN_KEY = 'wedding_admin_token'
  var STAGES = ['封面', '故事', '相册', '婚礼信息', '回执', '祝福', '尾幕']

  var $ = function (id) { return document.getElementById(id) }
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  var app = null, auth = null, token = '', pollTimer = null, expired = false

  function call (name, data) {
    return app.callFunction({ name: name, data: data }).then(function (r) { return r.result })
  }

  function status (text, isErr) {
    $('lgstatus').textContent = text || ''
    $('lgstatus').className = 'lg-status' + (isErr ? ' err' : '')
  }

  function showLogin () {
    $('view-login').hidden = false
    $('view-dash').hidden = true
    $('btn-logout').hidden = true
  }

  function showDash () {
    $('view-login').hidden = true
    $('view-dash').hidden = false
    $('btn-logout').hidden = false
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
  }

  /* ---------------- 登录 ---------------- */
  function startLogin () {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
    $('qr').hidden = true
    $('veil').hidden = false
    $('veil').textContent = '正在准备二维码…'
    $('btn-start').hidden = true
    status('正在请求小程序码…')

    withTimeout(call('webLogin', { action: 'create' }), 20000, '生成二维码').then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.msg) || '生成二维码失败')
      $('qr').src = res.qrcode
      $('qr').hidden = false
      $('veil').hidden = true
      status('请用微信扫一扫，扫码后在手机上确认登录')

      var deadline = Date.now() + (res.ttl || 300000)
      pollTimer = setInterval(function () {
        if (Date.now() > deadline) {
          clearInterval(pollTimer); pollTimer = null
          $('veil').hidden = false
          $('veil').textContent = '二维码已过期'
          $('btn-start').hidden = false
          status('二维码已过期，请刷新后重新扫码', true)
          return
        }
        withTimeout(call('webLogin', { action: 'poll', scene: res.scene, secret: res.secret }), 15000, '轮询')
          .then(function (p) {
          if (!p || !p.ok) {
            if (p && p.expired) {
              clearInterval(pollTimer); pollTimer = null
              $('veil').hidden = false
              $('veil').textContent = '二维码已过期'
              $('btn-start').hidden = false
              status(p.msg || '二维码已过期', true)
            }
            return
          }
          if (p.status === 'confirmed') {
            clearInterval(pollTimer); pollTimer = null
            token = p.token
            try { localStorage.setItem(TOKEN_KEY, token) } catch (e) {}
            status('登录成功，正在加载数据…')
            loadDash()
          }
        }).catch(function () { /* 轮询期间的偶发失败忽略，下一次继续 */ })
      }, 2000)
    }).catch(function (e) {
      $('veil').hidden = false
      $('veil').textContent = '二维码加载失败'
      $('btn-start').hidden = false
      status((e && e.message) || '二维码加载失败', true)
    })
  }

  function onUnauthorized (msg) {
    token = ''
    expired = true
    try { localStorage.removeItem(TOKEN_KEY) } catch (e) {}
    showLogin()
    status(msg || '登录已过期，请重新扫码', true)
    $('veil').hidden = false
    $('veil').textContent = '需要重新登录'
    $('btn-start').hidden = false
  }

  /* ---------------- 看板 ---------------- */
  function loadDash () {
    return call('adminManage', { action: 'stats', token: token }).then(function (r) {
      if (!r || !r.ok) { onUnauthorized(r && r.msg); return }
      showDash()
      $('who').textContent = '已登录 · 分享码 ' + (r.site && r.site.share_code || '-')
      renderStats(r)
      $('lastload').textContent = '最近刷新：' + new Date().toLocaleString('zh-CN')
      return Promise.all([
        call('adminManage', { action: 'listGreetings', token: token, offset: 0 }),
        call('adminManage', { action: 'listRsvps', token: token }),
      ]).then(function (a) {
        renderGreetings(a[0]); renderRsvps(a[1])
      })
    }).catch(function (e) {
      status((e && e.message) || '加载失败，请刷新重试', true)
    })
  }

  function renderStats (r) {
    var o = r.overview || {}
    $('kpis').innerHTML = [
      kpi(o.pv, '总访问 PV'), kpi(o.uv, '访客数 UV'), kpi(o.greetings, '祝福留言'), kpi(o.rsvps, '回执份数'),
    ].join('')

    var top = 0
    ;(r.trend || []).forEach(function (d) { if (d.pv > top) top = d.pv })
    top = top || 1
    $('chart').innerHTML = '<div class="bars">' + (r.trend || []).map(function (d) {
      var h = d.pv ? Math.max(4, Math.round(d.pv / top * 100)) : 3
      var hot = d.pv && d.pv === top ? ' hot' : ''
      return '<div class="bi" title="' + esc(d.day) + '：' + d.pv + ' 次访问 / ' + d.uv + ' 位访客">'
        + '<div class="v">' + (d.pv || '') + '</div>'
        + '<div class="t"><div class="f' + hot + '" style="height:' + h + '%"></div></div>'
        + '<div class="l">' + esc(String(d.day).slice(5)) + '</div></div>'
    }).join('') + '</div>'

    var dm = {}, base = 0, mx = 1
    ;(r.depth || []).forEach(function (d) {
      dm[d.stage] = d.visitors
      if (d.visitors > mx) mx = d.visitors
      if (d.stage === 0) base = d.visitors
    })
    $('depthhint').innerHTML = '看到第几幕的人最多 · 访客/浏览比 <b>'
      + (r.overview && r.overview.pv ? Math.round(r.overview.uv / r.overview.pv * 100) + '%' : '—') + '</b>'
    $('depth').innerHTML = STAGES.map(function (nm, i) {
      var v = dm[i] || 0
      var w = v ? Math.max(2, Math.round(v / mx * 100)) : 0
      var pct = base ? Math.round(v / base * 100) + '%' : '—'
      return '<div class="drow"><div class="dnm">' + (i + 1) + '.' + nm + '</div>'
        + '<div class="dtr"><div class="dfl" style="width:' + w + '%"></div></div>'
        + '<div class="dvv">' + v + ' 人<span class="dpct">' + pct + '</span></div></div>'
    }).join('')

    var sp = r.spread || []
    $('spread').innerHTML = sp.length
      ? '<table class="tb"><thead><tr><th>分享者</th><th class="r">带来访客</th></tr></thead><tbody>'
        + sp.map(function (s) {
          var who = s.name || ('未留名 · ' + String(s.vid || '').slice(0, 6) + '…')
          return '<tr><td>' + esc(who) + '</td><td class="r">' + s.visitors + ' 人</td></tr>'
        }).join('') + '</tbody></table>'
      : '<div class="empty">还没有通过分享进入的访客</div>'
  }

  function kpi (v, label) {
    return '<div class="kpi"><div class="kv">' + (v == null ? 0 : v) + '</div>'
      + '<div class="kl">' + esc(label) + '</div></div>'
  }

  function renderGreetings (r) {
    if (!r || !r.ok) { $('greets').innerHTML = '<div class="empty">' + esc((r && r.msg) || '读取失败') + '</div>'; return }
    $('gcnt').textContent = r.total || (r.items || []).length
    var items = r.items || []
    $('greets').innerHTML = items.length ? items.map(function (g) {
      return '<div class="msg"><div class="mh"><b>' + esc(g.name) + '</b>'
        + '<span class="mt">' + esc(g.time) + '</span></div>'
        + '<div class="mb">' + esc(g.text) + '</div></div>'
    }).join('') : '<div class="empty">还没有收到祝福留言</div>'
  }

  function renderRsvps (r) {
    if (!r || !r.ok) { $('rids').innerHTML = '<div class="empty">' + esc((r && r.msg) || '读取失败') + '</div>'; return }
    var items = r.items || []
    var s = r.summary || {}
    $('rcnt').textContent = items.length
    if (!items.length) { $('rids').innerHTML = '<div class="empty">还没有收到回执</div>'; return }
    $('rids').innerHTML = '<div class="rtotal">预计出席 <b>' + (s.guests || 0) + '</b> 人 · 共 ' + items.length + ' 份回执</div>'
      + '<table class="tb"><thead><tr><th>姓名</th><th>电话</th><th>是否到场</th><th class="r">人数</th>'
      + '<th>备注</th><th>提交时间</th></tr></thead><tbody>'
      + items.map(function (x) {
        return '<tr><td><b>' + esc(x.name) + '</b></td><td>' + esc(x.phone) + '</td>'
          + '<td class="' + (x.attending ? 'yes' : 'no') + '">' + (x.attending ? '准时到场' : '无法到场') + '</td>'
          + '<td class="r">' + (x.count || 0) + ' 人</td>'
          + '<td class="note">' + esc(x.note) + '</td><td class="mt">' + esc(x.time) + '</td></tr>'
      }).join('') + '</tbody></table>'
  }

  /* ---------------- 导出 ---------------- */
  function download (label, csv) {
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' })
    var a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = label + '-' + new Date().toISOString().slice(0, 10) + '.csv'
    a.click()
    setTimeout(function () { URL.revokeObjectURL(a.href) }, 3000)
  }

  document.addEventListener('click', function (e) {
    var t = e.target
    if (t && t.getAttribute && t.getAttribute('data-exp')) {
      var kind = t.getAttribute('data-exp')
      t.disabled = true
      call('adminManage', { action: kind === 'greeting' ? 'exportGreetings' : 'exportRsvps', token: token })
        .then(function (r) {
          if (!r || !r.ok) { onUnauthorized(r && r.msg); return }
          download(r.filename ? r.filename.replace('.csv', '') : kind, r.csv)
        })
        .finally(function () { t.disabled = false })
    }
  })

  /* ---------------- SDK 加载：自托管优先，CDN 兜底，每源带超时 ----------------
     外链 CDN 一旦被墙/超时，<script src> 会阻塞后续内联脚本执行，
     页面就会永远停在"正在准备二维码…"。所以改成动态加载 + 逐源兜底。 */
  var SDK_URLS = [
    'cloudbase.full.js',
    'https://static.cloudbase.net/cloudbase-js-sdk/3.10.2/cloudbase.full.js',
  ]

  function loadSdk (i) {
    i = i || 0
    if (window.cloudbase) return Promise.resolve()
    if (i >= SDK_URLS.length) {
      return Promise.reject(new Error('SDK 无法加载：本地与 CDN 源都失败了'))
    }
    var url = SDK_URLS[i]
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script'), settled = false
      var timer = setTimeout(function () { finish(new Error('加载超时 15s')) }, 15000)
      function finish (err) {
        if (settled) return
        settled = true
        clearTimeout(timer)
        if (err) { s.onload = s.onerror = null; reject(err) } else { resolve() }
      }
      s.src = url
      s.onload = function () { finish(window.cloudbase ? null : new Error('已下载但未导出 cloudbase')) }
      s.onerror = function () { finish(new Error('网络请求失败')) }
      document.head.appendChild(s)
    }).catch(function (e) {
      status('源 ' + (i + 1) + '/' + SDK_URLS.length + ' 失败（' + e.message + '），换下一个…', true)
      return loadSdk(i + 1)
    })
  }

  /* 给任意 Promise 加超时，避免"永远转圈" */
  function withTimeout (p, ms, label) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error(label + '超时（' + Math.round(ms / 1000) + 's）')) }, ms)
      Promise.resolve(p).then(function (v) { clearTimeout(t); resolve(v) },
        function (e) { clearTimeout(t); reject(e) })
    })
  }

  /* 匿名登录：不同版本的 SDK 方法名不一样，做个兜底 */
  function signInAnon () {
    if (!auth) return Promise.reject(new Error('auth 未初始化'))
    try {
      if (typeof auth.signInAnonymously === 'function') return auth.signInAnonymously()
      if (typeof auth.anonymousAuthProvider === 'function') return auth.anonymousAuthProvider().signIn()
    } catch (e) { return Promise.reject(e) }
    return Promise.reject(new Error('SDK 未提供匿名登录方法'))
  }

  /* ---------------- 启动 ---------------- */
  function boot () {
    $('btn-start').addEventListener('click', startLogin)
    $('btn-logout').addEventListener('click', function () {
      token = ''
      try { localStorage.removeItem(TOKEN_KEY) } catch (e) {}
      showLogin()
      startLogin()
    })

    showLogin()
    status('正在加载 SDK…')

    loadSdk().then(function () {
      try {
        app = cloudbase.init({ env: ENV })
        auth = app.auth()
      } catch (e) {
        throw new Error('SDK 初始化失败：' + ((e && e.message) || e))
      }

      var cached = ''
      try { cached = localStorage.getItem(TOKEN_KEY) || '' } catch (e) {}
      if (cached) {
        token = cached
        status('正在恢复登录状态…')
        loadDash()
        return
      }
      status('正在初始化…')
      // 匿名登录只是"拿个身份"；webLogin 已对匿名放开，失败也不该卡住流程
      return withTimeout(signInAnon(), 15000, '匿名登录')
        .then(function () { startLogin() })
        .catch(function (e) {
          status('匿名登录失败（' + ((e && e.message) || e) + '），继续尝试直连…')
          return startLogin()
        })
    }).catch(function (e) {
      showLogin()
      $('veil').textContent = '启动失败'
      $('btn-start').hidden = false
      status((e && e.message) || '启动失败', true)
    })
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
  else boot()
})()
</script>
</body>
</html>
